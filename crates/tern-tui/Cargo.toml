[package]
name = "tern-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tern 的终端界面：常驻内存约 10 MB，看账、切模型、起停网关"

# 同时提供 lib 和 bin：
# - lib 让 `tern tui` 能在**当前进程内**接管终端（raw mode + alternate screen），
#   spawn 子进程会另开窗口或在管道里失败
# - bin 让 `tern-tui` 能单独跑（开发、或不想带网关的那份）
[lib]
name = "tern_tui"
path = "src/lib.rs"

[[bin]]
name = "tern-tui"
path = "src/main.rs"

[dependencies]
tern-gateway = { path = "../tern-gateway" }
tern-store = { path = "../tern-store" }
ratatui = "0.29"
crossterm = "0.29"
serde_json = "1"
dirs = "6.0"
chrono = "0.4"
# Summary.cost 是 Decimal；转成 f64 只为显示
rust_decimal = "1.33"

[dev-dependencies]
tempfile = "3"
