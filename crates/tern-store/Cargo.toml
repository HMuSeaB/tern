[package]
name = "tern-store"
description = "Usage storage and pricing for the tern gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

# 版本与 cc-switch 保持一致；依赖全部来自本地 registry 缓存，可 --offline 构建
[dependencies]
tern-gateway = { path = "../tern-gateway" }
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = "1.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
