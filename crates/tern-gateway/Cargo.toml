[package]
name = "tern-gateway"
description = "Protocol-translating local gateway for coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

# 版本与 cc-switch src-tauri/Cargo.toml 保持一致，便于后续从上游 cherry-pick
[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
flate2 = "1"
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
thiserror = "2.0"
url = "2.5"
once_cell = "1.21.3"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
