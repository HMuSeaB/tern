[workspace]
resolver = "2"
members = [
    "crates/tern-gateway",
    "crates/tern-store",
    "crates/tern-cli",
    "crates/tern-tui",
    "crates/tern-agent",
    "crates/tern-app/src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[profile.dev]
debug = 1
incremental = false

[workspace.dependencies]
# 版本必须和 crates/tern-app/package.json 里的 @tauri-apps/* 对齐：
# `tauri build` 启动时会比对两侧版本，不一致直接报错退出。
# 用 `=` 钉死而不是 `^`：钉死之后 cargo 不会在更新依赖时把 Rust 侧
# 悄悄升到 NPM 没跟上的版本，那种错只在打包时才暴露，最难查。
# `tray-icon`：托盘常驻（关窗不杀进程）。tray-icon 本来就在 tauri 的依赖树里，
# 开这个特性不引入新 crate，离线构建认得
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = { version = "=2.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
