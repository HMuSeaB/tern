# Pull request 上的检查。和 release 分开：那边只管打包，这边管"这次改动有没有
# 把东西弄坏"。分开的好处是 PR 上一眼能看到"测试过了没有"，而不必等一个
# 五分钟的构建。
#
# 只在 Rust 和前端真的动了的时候跑：改文档不该触发一次全量 cargo test。

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_DIR: crates/tern-app

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 只测这四个 crate，**不含 tern-app / tern-agent**。原因有两个：
      #
      # 1. tauri 的依赖树在 Linux 上会拉 glib-sys / gobject-sys / webkit2gtk-sys，
      #    缺一大堆系统库（libgtk-3-dev、libsoup-3-dev…），装齐比收益大
      # 2. 面板的 Rust 侧本来就有 panel.rs 那 7 条测试在 windows 上由 release
      #    workflow 覆盖；这里再加一遍只是把 CI 时间翻倍
      #
      # 真正要保证的"协议转换没错"全在 gateway / store / cli / tui 里，
      # 而那四个在 Linux 上原样能跑（测试用的是本地 socket 打桩，不连真上游）。
      - name: Rust 测试
        run: cargo test -p tern-gateway -p tern-store -p tern-cli -p tern-tui

      - uses: pnpm/action-setup@v4
        with:
          # 前端在 crates/tern-app 下，而 action-setup 默认读仓库根的
          # package.json——不指路的话它找不到 packageManager 字段，直接报
          # "No pnpm version is specified"
          package_json_file: ${{ env.APP_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: 前端类型检查
        working-directory: ${{ env.APP_DIR }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

      # 同样不含 tern-app：它的 Rust 侧在 Linux 上编不过（见上）
      - name: 格式与 lint
        run: |
          cargo fmt --all -- --check
          cargo clippy -p tern-gateway -p tern-store -p tern-cli -p tern-tui -- -A dead_code -A private_interfaces
